name: Build Android APK

on:
  workflow_dispatch:      # manually "Run workflow" button se trigger karo
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon & splash screen from resources/
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor plugins (push notifications etc.)
        run: npx cap sync android

      - name: Patch MainActivity.java (UPI payment fix)
        run: |
          TARGET="android/app/src/main/java/com/xevrontech/studybuddyzone/MainActivity.java"
          cp android-patch/MainActivity.java "$TARGET"

      - name: Patch AndroidManifest.xml (add <queries> block for UPI apps)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Insert the queries block right after the opening <manifest ...> tag
          python3 - <<'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          with open("android-patch/queries-snippet.xml") as f:
              snippet = f.read()
          content = re.sub(r'(<manifest[^>]*>)', r'\1\n' + snippet, content, count=1)
          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Copy google-services.json
        run: cp android-patch/google-services.json android/app/google-services.json

      - name: Patch build.gradle files for google-services plugin
        run: |
          # project-level build.gradle: add classpath
          sed -i "s#classpath 'com.android.tools.build:gradle.*#&\n        classpath 'com.google.gms:google-services:4.4.2'#" android/build.gradle
          # app-level build.gradle: apply plugin at the end
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Use fixed debug keystore (same signing key every build)
        run: |
          mkdir -p ~/.android
          cp android-patch/debug.keystore ~/.android/debug.keystore

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: studybuddyzone-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>StudyBuddyZone</title>

  <meta name="description" content="StudyBuddyZone - your all-in-one study companion." />
  <meta name="application-name" content="StudyBuddyZone" />
  <meta name="theme-color" content="#ffffff" />

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <!-- iOS/Android PWA install hints -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="StudyBuddyZone" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />

  <style>
    html, body {
      margin: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #333333;
    }
    .loader { text-align: center; }
    img { width: 84px; height: 84px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="loader">
    <img src="icons/icon-192.png" alt="StudyBuddyZone" />
    <div>Loading StudyBuddyZone...</div>
  </div>

  <script>
    // This page is the local app-shell loader used by:
    //  - the Android build (Capacitor briefly shows it before "server.url" takes over)
    //  - the Windows MSIX build (shown before WebView2 navigates to the live app)
    //  - a plain browser visit (redirects straight to the live app)
    var START_URL = "https://studybuddypro-psi.vercel.app/";

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("service-worker.js").catch(function () {
          // Non-fatal: app still works without offline support.
        });
      });
    }

    // Only auto-redirect when running as a plain web page (not inside the
    // Capacitor WebView or the Windows WebView2 host, which navigate on
    // their own so they can show native chrome/back-button handling).
    if (!window.Capacitor && !window.chrome?.webview) {
      window.location.replace(START_URL);
    }
  </script>
</body>
</html>
